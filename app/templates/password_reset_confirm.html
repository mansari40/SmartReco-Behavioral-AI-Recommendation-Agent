{% extends "base.html" %}

{% block title %}Choose a new password — SmartReco{% endblock %}
{% block main_class %}wide{% endblock %}

{% block content %}
<div class="auth-split">
    <div class="auth-copy">
        <span class="eyebrow">Create a new password</span>
        <h1>Secure your account again</h1>
        <p class="lede">Enter a new password and we’ll update your login immediately.</p>
    </div>
    <div class="auth-card">
        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="muted" style="display: none;"></div>
        <form id="confirm-form">
            <label for="password">New password</label>
            <input type="password" id="password" placeholder="At least 8 characters" required autocomplete="new-password" minlength="8">
            <label for="password2">Confirm password</label>
            <input type="password" id="password2" placeholder="Re-enter new password" required autocomplete="new-password" minlength="8">
            <button type="submit" class="btn" style="width: 100%;">Save password &rarr;</button>
        </form>
        <p class="auth-footer"><a href="/login">Back to sign in</a></p>
    </div>
</div>

<script>
function getQueryParam(name) {
    return new URLSearchParams(window.location.search).get(name);
}

const confirmForm = document.getElementById('confirm-form');
if (confirmForm) confirmForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    const token = getQueryParam('token');

    if (password !== password2) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.style.display = 'block';
        return;
    }
    if (!token) {
        errorEl.textContent = 'Reset token missing from the link.';
        errorEl.style.display = 'block';
        return;
    }

    try {
        const res = await fetch('/api/auth/password-reset/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password }),
        });
        if (!res.ok) {
            const data = await res.json();
            errorEl.textContent = data.detail || 'Could not reset password.';
            errorEl.style.display = 'block';
            return;
        }
        successEl.textContent = 'Password updated. You can now sign in with your new password.';
        successEl.style.display = 'block';
    } catch (err) {
        errorEl.textContent = 'Something went wrong. Try again.';
        errorEl.style.display = 'block';
    }
});
</script>
{% endblock %}
