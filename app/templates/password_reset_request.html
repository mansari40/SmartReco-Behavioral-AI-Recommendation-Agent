{% extends "base.html" %}

{% block title %}Reset password — SmartReco{% endblock %}
{% block main_class %}wide{% endblock %}

{% block content %}
<div class="auth-split">
    <div class="auth-copy">
        <span class="eyebrow">Forgot your password?</span>
        <h1>Reset your SmartReco login</h1>
        <p class="lede">Enter your email and we’ll send you a link to choose a new password.</p>
    </div>
    <div class="auth-card">
        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="muted" style="display: none;"></div>
        <form id="reset-form">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            <button type="submit" class="btn" style="width: 100%;">Send reset link &rarr;</button>
        </form>
        <p class="auth-footer"><a href="/login">Back to sign in</a></p>
    </div>
</div>

<script>
const resetForm = document.getElementById('reset-form');
if (resetForm) resetForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    const email = document.getElementById('email').value;

    try {
        const res = await fetch('/api/auth/password-reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
        });
        if (!res.ok) {
            const data = await res.json();
            errorEl.textContent = data.detail || 'Could not send reset link.';
            errorEl.style.display = 'block';
            return;
        }
        successEl.textContent = 'If that email is registered, a password reset link has been sent.';
        successEl.style.display = 'block';
    } catch (err) {
        errorEl.textContent = 'Something went wrong. Try again.';
        errorEl.style.display = 'block';
    }
});
</script>
{% endblock %}
