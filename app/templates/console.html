
{% extends "base.html" %}

{% block title %}Agent Console — SmartReco{% endblock %}

{% block content %}
<div style="margin-bottom: 2rem;">
    <span class="eyebrow">Real operational data, last 24h</span>
    <h1 style="font-size: 2rem;">Agent Console</h1>
</div>

<div id="console-container" class="panel-dark">
    <p class="muted">Checking access...</p>
</div>

<script>
(function () {
    const container = document.getElementById('console-container');
    if (!container) return;
    const token = localStorage.getItem('access_token');
    const role = localStorage.getItem('user_role');
    const POLL_INTERVAL_MS = 5000;

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function statCard(label, value, sublabel) {
        return '<div class="card">' +
            '<div class="mono muted" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem;">' + escapeHtml(label) + '</div>' +
            '<div style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 600;">' + value + '</div>' +
            (sublabel ? '<div class="muted" style="font-size: 0.8rem; margin-top: 0.3rem;">' + escapeHtml(sublabel) + '</div>' : '') +
            '</div>';
    }

    function render(stats) {
        let html = '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem;">';
        html += statCard('Calls (24h)', stats.calls_today, stats.mock_calls_today + ' mock, ' + stats.real_calls_today + ' real');
        html += statCard('Avg Latency', stats.avg_latency_ms + 'ms', null);
        html += statCard('Success Rate', Math.round(stats.success_rate * 100) + '%', null);
        html += statCard('Models Used', Object.keys(stats.model_breakdown).length, null);
        html += '</div>';

        html += '<h3 style="font-size: 1rem; margin-bottom: 0.9rem; color: var(--fog); text-transform: uppercase; letter-spacing: 0.04em; font-family: var(--font-mono);">Model Breakdown</h3>';
        html += '<div class="card" style="margin-bottom: 2rem;">';
        const entries = Object.entries(stats.model_breakdown);
        if (entries.length === 0) {
            html += '<p class="muted">No calls yet.</p>';
        } else {
            entries.forEach(function ([model, count]) {
                html += '<div class="mono" style="display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid var(--border);">';
                html += '<span>' + escapeHtml(model) + '</span><span style="color: var(--accent);">' + count + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        html += '<h3 style="font-size: 1rem; margin-bottom: 0.9rem; color: var(--fog); text-transform: uppercase; letter-spacing: 0.04em; font-family: var(--font-mono);">Recent Calls</h3>';
        html += '<div class="card mono" style="font-size: 0.8rem; padding: 0.5rem 1.5rem;">';
        if (stats.recent_calls.length === 0) {
            html += '<p class="muted" style="padding: 1rem 0;">No calls logged yet — browse the site to generate activity.</p>';
        } else {
            stats.recent_calls.forEach(function (call) {
                const time = new Date(call.created_at).toLocaleTimeString();
                const statusColor = call.success ? 'var(--accent)' : 'var(--danger)';
                const mockTag = call.is_mock ? ' <span style="color: var(--amber);">[mock]</span>' : '';
                html += '<div style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border);">';
                html += '<span class="muted">' + time + '</span>';
                html += '<span>' + escapeHtml(call.call_type) + ' &middot; ' + escapeHtml(call.model) + mockTag + '</span>';
                html += '<span style="color: ' + statusColor + ';">' + call.latency_ms + 'ms</span>';
                html += '</div>';
                if (!call.success && call.error) {
                    html += '<div class="muted" style="font-size: 0.72rem; padding: 0 0 0.5rem; color: var(--danger);">' + escapeHtml(call.error) + '</div>';
                }
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    async function poll() {
        try {
            const res = await fetch('/api/console/stats', {
                headers: { 'Authorization': 'Bearer ' + token },
            });
            if (res.ok) render(await res.json());
        } catch (err) {
            // silent — console is a diagnostic view, shouldn't be disruptive on failure
        }
    }

    if (!token || role !== 'admin') {
        container.innerHTML = '<div class="card"><p class="muted">Admin access required.</p></div>';
    } else {
        poll();
        setInterval(poll, POLL_INTERVAL_MS);
    }
})();
</script>
{% endblock %}
