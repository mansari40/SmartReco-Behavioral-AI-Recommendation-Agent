# Render Blueprint for UPulse.
#
# Start command is codified here (Render uses startCommand over a Procfile
# when render.yaml is present): the app must bind 0.0.0.0 and honor Render's
# $PORT. No manual seed/promote steps are required — the app bootstraps
# schema, admin, 52 courses, and pgvector embeddings on startup.

services:
  - type: web
    name: upulse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_EMAIL
        value: upulse@admin.com
      - key: ADMIN_PASSWORD
        sync: false # set once in the Render dashboard; never commit it
      - key: SECRET_KEY
        sync: false # set to a long random string in the Render dashboard
      - key: OPENROUTER_API_KEY
        sync: false # set in the Render dashboard
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      - key: OPENROUTER_MAX_TOKENS
        value: "4096"
      - key: MOCK_EMBEDDINGS
        value: "false"
      - key: PUBLIC_BASE_URL
        fromService:
          name: upulse
          type: web
          property: url
      - key: DATABASE_URL
        fromDatabase:
          name: upulse-db
          property: connectionString

databases:
  - name: upulse-db
    plan: free